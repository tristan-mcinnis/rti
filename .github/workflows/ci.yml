name: CI

# Phase 0 of PRODUCTION-GOAL.md — the safety net.
# Two jobs run in parallel on every PR to main (and every push to main):
#   build-test : xcodegen → build Debug → run the XCTest suite on a macOS runner.
#   lint       : swiftformat --lint, scoped to the Swift files this change touches
#                (boy-scout adoption — the legacy tree is not mass-reformatted).

on:
  push:
    branches: [main]
    # Skip the (paid, macOS-runner) build on doc-only changes.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Debug)
    # Self-hosted runner on the maintainer's Mac: the XCTest suite needs macOS +
    # Xcode, and GitHub's hosted macOS runners bill at 10x the Linux rate
    # (~$0.08/min), which was the single largest line in the account's
    # Actions spend. Free on own hardware.
    runs-on: [self-hosted, macOS]
    # RTI builds HouseChatCore from ../quick-launch/Packages/HouseChatCore, so
    # the two repos are checked out side by side under the workspace:
    #   $GITHUB_WORKSPACE/rti/           this repo
    #   $GITHUB_WORKSPACE/quick-launch/  tristan-mcinnis/quick-launch
    # Every step after the checkouts runs inside rti/.
    defaults:
      run:
        working-directory: rti
    steps:
      - name: Check out rti
        uses: actions/checkout@v4
        with:
          path: rti

      - name: Check out quick-launch (owns HouseChatCore)
        uses: actions/checkout@v4
        with:
          repository: tristan-mcinnis/quick-launch
          path: quick-launch
          # quick-launch is private today, so the default GITHUB_TOKEN of this
          # repo cannot read it: add a read-only PAT (or deploy key token) as
          # the repo secret QUICK_LAUNCH_TOKEN. Once quick-launch is public the
          # secret is not needed and this falls back to github.token.
          token: ${{ secrets.QUICK_LAUNCH_TOKEN || github.token }}

      - name: Check the clone layout
        run: scripts/check-layout.sh

      - name: Scrub gate (no personal paths, ids or keys in tracked files)
        run: scripts/scrub.sh

      - name: Check Xcode (needs 16+ for the Swift 6 toolchain)
        # project.yml sets SWIFT_VERSION 6.0 and HouseChatCore is
        # swift-tools-version 6.0, so Xcode 16 is the floor. The runner is a
        # self-hosted Mac with one Xcode.app, so this checks the floor instead
        # of switching Xcode versions.
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 16 ]; then
            echo "::error::RTI needs Xcode 16 or newer (Swift 6 toolchain); found '${MAJOR:-none}'"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: rti/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('rti/RTI/RTI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Provide Secrets.swift stub
        # Secrets.swift is gitignored (never holds real keys — those live in the
        # Keychain at runtime). CI seeds it from the committed example so the
        # source tree compiles, exactly as documented for a first checkout.
        run: cp RTI/Sources/Secrets.swift.example RTI/Sources/Secrets.swift

      - name: Generate Xcode project
        working-directory: rti/RTI
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project RTI/RTI.xcodeproj \
            -scheme RTI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            build

      - name: Test (Debug)
        run: |
          xcodebuild \
            -project RTI/RTI.xcodeproj \
            -scheme RTI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            test

  lint:
    name: SwiftFormat (new files)
    # Self-hosted runner on the maintainer's Mac: the XCTest suite needs macOS +
    # Xcode, and GitHub's hosted macOS runners bill at 10x the Linux rate
    # (~$0.08/min), which was the single largest line in the account's
    # Actions spend. Free on own hardware.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Lint newly-added Swift files
        run: |
          set -euo pipefail
          # Full history of main so merge-base can find the fork point.
          git fetch --no-tags origin main
          BASE=$(git merge-base origin/main HEAD || true)
          if [ -z "$BASE" ]; then
            echo "No merge-base with origin/main — nothing to lint."
            exit 0
          fi
          # Lint only NEW files (added). The legacy tree predates SwiftFormat
          # and follows none of its conventions, so linting modified files would
          # force a full reformat on every one-line touch — burying logic in
          # formatting noise (and the goal doc forbids a mass reformat). New
          # code (the growing RTICore) is clean for free. --find-renames keeps
          # relocated legacy files (git mv) out of the "added" set.
          FILES=$(git diff --find-renames --name-only --diff-filter=A "$BASE" HEAD -- '*.swift')
          if [ -z "$FILES" ]; then
            echo "No newly-added Swift files — nothing to lint."
            exit 0
          fi
          echo "Linting newly-added Swift files:"
          echo "$FILES"
          # .swiftformat at the repo root supplies the rules/version.
          echo "$FILES" | tr '\n' '\0' | xargs -0 swiftformat --lint
