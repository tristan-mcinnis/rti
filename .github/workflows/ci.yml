name: CI

# Phase 0 of PRODUCTION-GOAL.md — the safety net.
# Two jobs run in parallel, each on its own hosted runner, on every PR to
# main (and every push to main):
#   build-test : xcodegen → build Debug → run the XCTest suite on a macOS runner.
#   lint       : swiftformat --lint, scoped to the Swift files this change touches
#                (boy-scout adoption — the legacy tree is not mass-reformatted).

on:
  push:
    branches: [main]
    # Skip the macOS build on doc-only changes. Later patterns win, so
    # docs/workflows/ (flows.json is WorkflowDocTests input) still runs CI.
    # The local pre-push hook uses the same rule.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.gitignore'
      - '!LICENSE'
      - 'docs/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.gitignore'
      - '!LICENSE'
      - 'docs/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Debug)
    # GitHub-hosted macOS 26 (Xcode 26). The repo is public, so standard
    # hosted runners cost nothing. The old single self-hosted runner (the
    # maintainer's Mac) sat offline for 19 days and ran lint and build one
    # after the other; hosted runners give each job its own machine.
    runs-on: macos-26
    # house-chat-core and design-system are pinned by tag in RTI/project.yml,
    # so Xcode fetches them with the other packages and nothing else is
    # checked out. Every step runs inside rti/.
    defaults:
      run:
        working-directory: rti
    steps:
      - name: Check out rti
        uses: actions/checkout@v4
        with:
          path: rti

      - name: Scrub gate (no personal paths, ids or keys in tracked files)
        run: scripts/scrub.sh

      - name: Check Xcode (needs 16+ for the Swift 6 toolchain)
        # project.yml sets SWIFT_VERSION 6.0 and HouseChatCore is
        # swift-tools-version 6.0, so Xcode 16 is the floor. This checks the
        # image's default Xcode against the floor instead of switching versions.
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 16 ]; then
            echo "::error::RTI needs Xcode 16 or newer (Swift 6 toolchain); found '${MAJOR:-none}'"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: rti/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('rti/RTI/RTI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Provide Secrets.swift stub
        # Secrets.swift is gitignored (never holds real keys — those live in the
        # Keychain at runtime). CI seeds it from the committed example so the
        # source tree compiles, exactly as documented for a first checkout.
        run: cp RTI/Sources/Secrets.swift.example RTI/Sources/Secrets.swift

      - name: Generate Xcode project
        working-directory: rti/RTI
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project RTI/RTI.xcodeproj \
            -scheme RTI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            build

      - name: Test (Debug)
        run: |
          xcodebuild \
            -project RTI/RTI.xcodeproj \
            -scheme RTI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            test

  lint:
    name: SwiftFormat (new files)
    # Own hosted runner, no `needs:`: lint reports in parallel with the build.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftFormat
        run: brew list swiftformat >/dev/null 2>&1 || brew install swiftformat

      - name: Lint newly-added Swift files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Full history of the default branch so merge-base can find the fork point.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          # What this change touched. A push to main diffs against the commit
          # the branch was at before the push (github.event.before); merge-base
          # with origin/main would be HEAD itself there, so it linted nothing.
          # A pull request (or a push whose `before` is not in history, such as
          # a force push) diffs against the merge base with the default branch.
          # A push with an all-zeros `before` (a new branch) has no old tip, so
          # it takes the merge base too, and when that is HEAD itself it falls
          # back to the files the pushed commit changed.
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"; WHY="push: github.event.before"
          else
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
            WHY="merge base with origin/$DEFAULT_BRANCH"
            if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              # Nothing to diff against: lint every file the pushed commit changed.
              BASE=$(git rev-parse -q --verify HEAD^ || git hash-object -t tree /dev/null)
              WHY="no usable base: the files HEAD changed"
            fi
          fi
          echo "Diffing $BASE..HEAD ($WHY). Files this change touched:"
          git diff --find-renames --name-status "$BASE" HEAD
          # Lint only NEW files (added). The legacy tree predates SwiftFormat
          # and follows none of its conventions, so linting modified files would
          # force a full reformat on every one-line touch, burying logic in
          # formatting noise (and the goal doc forbids a mass reformat). New
          # code (the growing RTICore) is clean for free. --find-renames keeps
          # relocated legacy files (git mv) out of the "added" set.
          FILES=$(git diff --find-renames --name-only --diff-filter=A "$BASE" HEAD -- '*.swift')
          if [ -z "$FILES" ]; then
            echo "No newly-added Swift files in this change: nothing to lint."
            exit 0
          fi
          echo "Linting newly-added Swift files:"
          echo "$FILES"
          # .swiftformat at the repo root supplies the rules/version.
          echo "$FILES" | tr '\n' '\0' | xargs -0 swiftformat --lint
