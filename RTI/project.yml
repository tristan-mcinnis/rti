name: RTI
options:
  bundleIdPrefix: com.tristan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Common settings shared by all configurations. Per-configuration overrides
# (signing identity, hardened runtime) live under `configs:` below — Debug
# stays ad-hoc-signed for friction-free local builds; Release expects a real
# Developer ID identity to be passed in via `xcodebuild` flags or env, which
# `scripts/release.sh` handles.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_ENTITLEMENTS: Sources/RTI.entitlements
    INFOPLIST_FILE: Sources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Default Release signing is the personal Apple Development identity so
      # local installs keep a STABLE identity across rebuilds — macOS ties
      # mic / system-audio / screen-recording grants to the signing identity,
      # and ad-hoc builds (unique cdhash per build) reset all permissions on
      # every update (bitten 2026-08-14). scripts/release.sh still overrides
      # these at build time with Developer ID for notarized DMGs.
      # xcodebuild signs ad-hoc here (Xcode's account machinery is unusable
      # headlessly); scripts/install-local.sh then RE-SIGNS the product with
      # the personal Apple Development certificate so the identity stays
      # stable across updates — macOS ties mic / system-audio / screen
      # grants to the signing identity, and ad-hoc builds reset them on
      # every install (bitten 2026-08-14). scripts/release.sh overrides
      # with Developer ID for notarized DMGs.
      ENABLE_HARDENED_RUNTIME: YES

packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: "4.0.8"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.1.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  # Pure-Swift logic core (no AppKit/SwiftUI, no @MainActor). Extracted so the
  # transcription/LLM/analysis logic is unit-testable without hosting into the
  # SwiftUI app + double-instantiating NSApplication. Both the app and the test
  # bundle link it. Phase 1 of PRODUCTION-GOAL.md.
  RTICore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.core

  RTI:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - RTI.entitlements
          - Secrets.swift.example
    dependencies:
      - target: RTICore
      - package: Starscream
      - package: Yams
      - package: MarkdownUI
        product: MarkdownUI

  # Standalone test bundle — no host app, no NSApplication. Types that have
  # moved into RTICore are reached via `import RTICore`; the remaining entries
  # below are app-module files still compiled directly into the bundle until
  # they too migrate to RTICore in a later Phase 1 slice.
  RTITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/UI/CommandPalette/CommandRegistry.swift
      - path: Sources/Session/VaultWorkstreamStore.swift
      - path: Sources/Session/SentinelPaths.swift
      - path: Sources/LLM/AssistantTurnBuilder.swift
      - path: Sources/Session/VaultFiles.swift
      - path: Sources/Session/SessionArchiveMetadata.swift
      - path: Sources/Audio/WAVWriter.swift
      - path: Sources/Audio/AudioInputDevice.swift
      - path: Sources/Support/AppLog.swift
    dependencies:
      - target: RTICore
      - package: Yams
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  RTI:
    build:
      targets:
        RTI: all
        RTITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RTITests
    archive:
      config: Release
