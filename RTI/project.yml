name: RTI
options:
  bundleIdPrefix: com.tristan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # HouseChatCore lives in the sibling quick-launch clone (see `packages:`).
  # Fail here with the clone layout, not later with a vague package error.
  # Runs from RTI/ (where xcodegen is run), so the script is one level up.
  preGenCommand: ../scripts/check-layout.sh

configs:
  Debug: debug
  Release: release

# Common settings shared by all configurations. Per-configuration overrides
# (signing identity, hardened runtime) live under `configs:` below — Debug
# stays ad-hoc-signed for friction-free local builds; Release expects a real
# Developer ID identity to be passed in via `xcodebuild` flags or env, which
# `scripts/release.sh` handles.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_ENTITLEMENTS: Sources/RTI.entitlements
    INFOPLIST_FILE: Sources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Default Release signing is the personal Apple Development identity so
      # local installs keep a STABLE identity across rebuilds — macOS ties
      # mic / system-audio / screen-recording grants to the signing identity,
      # and ad-hoc builds (unique cdhash per build) reset all permissions on
      # every update (bitten 2026-08-14). scripts/release.sh still overrides
      # these at build time with Developer ID for notarized DMGs.
      # xcodebuild signs ad-hoc here (Xcode's account machinery is unusable
      # headlessly); scripts/install-local.sh then RE-SIGNS the product with
      # the personal Apple Development certificate so the identity stays
      # stable across updates — macOS ties mic / system-audio / screen
      # grants to the signing identity, and ad-hoc builds reset them on
      # every install (bitten 2026-08-14). scripts/release.sh overrides
      # with Developer ID for notarized DMGs.
      ENABLE_HARDENED_RUNTIME: YES

packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: "4.0.8"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.1.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  # Shared House chat logic (context policy, command parsing, durable
  # conversation/attachment archives, versioned turn metadata). A local path so
  # RTI and Quick Launch build the same source revision. Path is anchored at
  # this file's directory (RTI/).
  HouseChatCore:
    path: ../../quick-launch/Packages/HouseChatCore

targets:
  # Pure-Swift logic core (no AppKit/SwiftUI, no @MainActor). Extracted so the
  # transcription/LLM/analysis logic is unit-testable without hosting into the
  # SwiftUI app + double-instantiating NSApplication. Both the app and the test
  # bundle link it. Phase 1 of PRODUCTION-GOAL.md.
  RTICore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    dependencies:
      - package: HouseChatCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.core

  RTI:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - RTI.entitlements
          - Secrets.swift.example
      # The license and third-party notices ship inside the app, in
      # Contents/Resources, next to the code they cover.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: RTICore
      - package: Starscream
      - package: Yams
      - package: MarkdownUI
        product: MarkdownUI
      - package: HouseChatCore
      - package: HouseChatCore
        product: HouseChatDocuments

  # Standalone test bundle — no host app, no NSApplication. Types that have
  # moved into RTICore are reached via `import RTICore`; the remaining entries
  # below are app-module files still compiled directly into the bundle until
  # they too migrate to RTICore in a later Phase 1 slice.
  RTITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/UI/CommandPalette/CommandRegistry.swift
      - path: Sources/UI/StatusItemSymbol.swift
      # StatusItemSymbol reads House.Control.statusGlyph (fed0289).
      - path: Sources/UI/HouseDesign.swift
      - path: Sources/Session/VaultWorkstreamStore.swift
      - path: Sources/Session/VaultPaths.swift
      - path: Sources/LLM/VaultSearch.swift
      - path: Sources/LLM/VaultSearchCLI.swift
      - path: Sources/LLM/VaultRetrieval.swift
      - path: Sources/LLM/AssistantTurnBuilder.swift
      - path: Sources/LLM/ToolExecutor.swift
      - path: Sources/Analysis/AutoAssistCard.swift
      - path: Sources/Analysis/FindingEntry.swift
      - path: Sources/Session/VaultMeetings.swift
      - path: Sources/Session/VaultFiles.swift
      - path: Sources/Session/VaultLogStore.swift
      - path: Sources/Session/SessionArchiveMetadata.swift
      - path: Sources/Session/MeetingProcessorConfig.swift
      - path: Sources/Audio/WAVWriter.swift
      - path: Sources/Audio/AudioInputDevice.swift
      - path: Sources/Support/AppLog.swift
      - path: Sources/Support/AppSupportPaths.swift
      - path: Sources/LLM/ChatThreadStore.swift
      - path: Sources/Support/NotificationNames.swift
      - path: Sources/UI/SessionsControl/ChatLibraryRules.swift
      - path: Sources/UI/SessionsControl/ChatLibraryLegacy.swift
      - path: Sources/Support/SettingsKeys.swift
      - path: Sources/Support/ExternalTools.swift
      - path: Sources/LLM/RetrievalHeuristics.swift
    dependencies:
      - target: RTICore
      - package: Yams
      - package: HouseChatCore
      - package: HouseChatCore
        product: HouseChatDocuments
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # Offscreen render proof. Compiles the whole app module (minus the @main
  # entry point) into a standalone test bundle so SwiftUI surfaces can be
  # rendered headlessly with NSHostingView + cacheDisplay and compared against
  # the design mockups. No window is ever ordered on screen.
  RTIRenderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RenderTests
      - path: Sources
        excludes:
          - Info.plist
          - RTI.entitlements
          - Secrets.swift.example
          - RTIApp.swift
    dependencies:
      - target: RTICore
      - package: Starscream
      - package: Yams
      - package: MarkdownUI
        product: MarkdownUI
      - package: HouseChatCore
      - package: HouseChatCore
        product: HouseChatDocuments
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.rendertests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # The app's Info.plist declares NSPrincipalClass = NSApplication. In a
        # host-less test bundle that makes NSBundle instantiate a *second*
        # NSApplication behind +sharedApplication's back, which traps as soon
        # as anything creates a view. Generate a plain bundle plist instead.
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  RTI:
    build:
      targets:
        RTI: all
        RTITests: [test]
        RTIRenderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RTITests
        - RTIRenderTests
    archive:
      config: Release
