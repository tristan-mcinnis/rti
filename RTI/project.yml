name: RTI
options:
  bundleIdPrefix: com.tristan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Common settings shared by all configurations. Per-configuration overrides
# (signing identity, hardened runtime) live under `configs:` below — Debug
# stays ad-hoc-signed for friction-free local builds; Release expects a real
# Developer ID identity to be passed in via `xcodebuild` flags or env, which
# `scripts/release.sh` handles.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_ENTITLEMENTS: Sources/RTI.entitlements
    INFOPLIST_FILE: Sources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Signing identity is supplied at build time:
      #   xcodebuild ... DEVELOPMENT_TEAM=$TEAM_ID \
      #              CODE_SIGN_STYLE=Manual \
      #              CODE_SIGN_IDENTITY="Developer ID Application"
      # (see scripts/release.sh). Hardened Runtime is required for
      # notarization.
      ENABLE_HARDENED_RUNTIME: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: "4.0.8"
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.1.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  RTI:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - RTI.entitlements
          - Secrets.swift.example
    dependencies:
      - package: GRDB
      - package: Starscream
      - package: Yams
      - package: MarkdownUI
        product: MarkdownUI
      - target: RTIMCP
        copy:
          destination: resources

  # Standalone command-line binary that exposes the markdown Corpus to
  # external agents (Claude Desktop, Codex, OpenCode, Gemini CLI, Claude
  # Code) over JSON-RPC stdio. Reads ~/meetings/, the SQLite FTS sidecar,
  # and live-session JSONL streams. Read-only in v1.
  RTIMCP:
    type: tool
    platform: macOS
    sources:
      - path: MCP
      - path: Sources/Corpus/CorpusEntry.swift
      - path: Sources/Corpus/CorpusReader.swift
      - path: Sources/Corpus/LiveJSONLWriter.swift
    dependencies:
      - package: GRDB
      - package: Yams
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: rti-mcp
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # Standalone test bundle — no host app, no NSApplication. Each Swift file
  # under test is compiled directly into the bundle (so we can unit-test
  # internal types without `@testable import RTI`, which would require hosting
  # into the SwiftUI app and double-instantiating NSApplication).
  RTITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Soniox/SonioxProtocol.swift
      - path: Sources/Session/SpeakerTurn.swift
      - path: Sources/Database/Models/TranscriptEntry.swift
      - path: Sources/LLM/LLMError.swift
      - path: Sources/Soniox/SonioxFailure.swift
      - path: Sources/UI/CommandPalette/CommandRegistry.swift
      - path: Sources/UI/CommandPalette/PaletteSearch.swift
      - path: Sources/UI/CommandPalette/SessionDetailRequest.swift
      - path: Sources/UI/SessionDetail/TranscriptHighlight.swift
      - path: Sources/Database/Models/Session.swift
      - path: Sources/Session/SessionSearchResult.swift
      - path: Sources/Corpus/CorpusEntry.swift
      - path: Sources/Corpus/CorpusReader.swift
      - path: Sources/Corpus/CorpusWriter.swift
      - path: Sources/Corpus/MarkdownRenderer.swift
      - path: Sources/Corpus/LiveJSONLWriter.swift
      - path: Sources/Corpus/TranscriptRender.swift
      - path: Sources/Corpus/CorpusFTSReindexer.swift
      - path: Sources/Corpus/ChunkPolicy.swift
      - path: Sources/Support/SpeakerLabelMapping.swift
      - path: Sources/Support/TimeFormat.swift
      - path: Sources/Support/SummaryFormatting.swift
      - path: Sources/Support/JSONExtractor.swift
    dependencies:
      - package: GRDB
      - package: Yams
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.rti.personal.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  RTI:
    build:
      targets:
        RTI: all
        RTITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RTITests
    archive:
      config: Release
